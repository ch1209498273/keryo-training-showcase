<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="系统架构与权限三道收敛">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#0C1526"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12253D"/>
      <stop offset="100%" stop-color="#0D1C2F"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F2941"/>
      <stop offset="100%" stop-color="#1A1E3D"/>
    </linearGradient>
    <linearGradient id="dbx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101F35"/>
      <stop offset="100%" stop-color="#0B1728"/>
    </linearGradient>
    <marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38BDF8" fill-opacity="0.8"/>
    </marker>
  </defs>

  <rect width="1200" height="470" fill="url(#cbg)"/>
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <text x="56" y="46" fill="#64748B" font-size="13" letter-spacing="2.6">ARCHITECTURE</text>
    <text x="56" y="86" fill="#E2E8F0" font-size="28" font-weight="700">权限三道收敛，前端隐藏不算数</text>

    <!-- 客户端 -->
    <text x="56" y="126" fill="#64748B" font-size="12.5" letter-spacing="1.4">CLIENTS</text>
    <text x="1142" y="126" fill="#475569" font-size="12.5" text-anchor="end">Vue 3 · TypeScript · Vite · Element Plus</text>
    <rect x="56" y="138" width="340" height="56" rx="10" fill="url(#box)" stroke="#38BDF8" stroke-opacity="0.35"/>
    <text x="226" y="172" fill="#E2E8F0" font-size="15" text-anchor="middle">总部管理端</text>
    <rect x="436" y="138" width="340" height="56" rx="10" fill="url(#box)" stroke="#38BDF8" stroke-opacity="0.35"/>
    <text x="606" y="172" fill="#E2E8F0" font-size="15" text-anchor="middle">中心管理端（数据范围受限）</text>
    <rect x="816" y="138" width="340" height="56" rx="10" fill="url(#box)" stroke="#38BDF8" stroke-opacity="0.35"/>
    <text x="986" y="172" fill="#E2E8F0" font-size="15" text-anchor="middle">学员端</text>

    <line x1="599" y1="200" x2="599" y2="230" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6" marker-end="url(#ar3)"/>
    <text x="612" y="222" fill="#475569" font-size="12">HTTP / JSON</text>

    <!-- API 层 -->
    <rect x="56" y="238" width="1086" height="122" rx="14" fill="url(#api)" stroke="#38BDF8" stroke-opacity="0.30"/>
    <text x="78" y="266" fill="#7DD3FC" font-size="13" letter-spacing="1.4">SPRING BOOT 3 API · SHIRO + JWT</text>

    <rect x="78" y="282" width="330" height="60" rx="9" fill="#0B1B2E" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="98" y="306" fill="#7DD3FC" font-size="12.5" letter-spacing="1.2">01 路由可达性</text>
    <text x="98" y="328" fill="#CBD5E1" font-size="13.5">菜单授权决定能进哪些页面</text>

    <rect x="424" y="282" width="330" height="60" rx="9" fill="#0B1B2E" stroke="#22D3EE" stroke-opacity="0.6"/>
    <text x="444" y="306" fill="#67E8F9" font-size="12.5" letter-spacing="1.2">02 接口门禁</text>
    <text x="444" y="328" fill="#CBD5E1" font-size="13.5">角色 / 权限断言，直调一律拒绝</text>

    <rect x="770" y="282" width="350" height="60" rx="9" fill="#0B1B2E" stroke="#A78BFA" stroke-opacity="0.6"/>
    <text x="790" y="306" fill="#C4B5FD" font-size="12.5" letter-spacing="1.2">03 SQL 数据范围</text>
    <text x="790" y="328" fill="#CBD5E1" font-size="13.5">查询层自动注入部门条件</text>

    <line x1="408" y1="312" x2="420" y2="312" stroke="#38BDF8" stroke-width="1.6" stroke-opacity="0.7" marker-end="url(#ar3)"/>
    <line x1="754" y1="312" x2="766" y2="312" stroke="#38BDF8" stroke-width="1.6" stroke-opacity="0.7" marker-end="url(#ar3)"/>

    <!-- 存储 -->
    <line x1="280" y1="360" x2="280" y2="384" stroke="#38BDF8" stroke-width="1.6" stroke-opacity="0.45"/>
    <line x1="599" y1="360" x2="599" y2="384" stroke="#38BDF8" stroke-width="1.6" stroke-opacity="0.45"/>
    <line x1="920" y1="360" x2="920" y2="384" stroke="#38BDF8" stroke-width="1.6" stroke-opacity="0.45"/>

    <rect x="56" y="386" width="448" height="58" rx="10" fill="url(#dbx)" stroke="#1E3A54"/>
    <text x="280" y="414" fill="#E2E8F0" font-size="14.5" text-anchor="middle">MySQL 8.4</text>
    <text x="280" y="434" fill="#64748B" font-size="12.5" text-anchor="middle">审计表禁止删除 · 唯一键兜住并发</text>

    <rect x="522" y="386" width="290" height="58" rx="10" fill="url(#dbx)" stroke="#1E3A54"/>
    <text x="667" y="414" fill="#E2E8F0" font-size="14.5" text-anchor="middle">Redis</text>
    <text x="667" y="434" fill="#64748B" font-size="12.5" text-anchor="middle">会话与菜单缓存，缺省自动降级</text>

    <rect x="830" y="386" width="312" height="58" rx="10" fill="url(#dbx)" stroke="#1E3A54"/>
    <text x="986" y="414" fill="#E2E8F0" font-size="14.5" text-anchor="middle">文件存储 / LLM 服务</text>
    <text x="986" y="434" fill="#64748B" font-size="12.5" text-anchor="middle">OpenAI 兼容协议，供应商可替换</text>
  </g>
</svg>
