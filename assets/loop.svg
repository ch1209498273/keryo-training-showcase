<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 424" width="1200" height="424" role="img" aria-label="业务闭环与证据留痕">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#0C1727"/>
    </linearGradient>
    <linearGradient id="cardgd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132A45"/>
      <stop offset="100%" stop-color="#0E1F34"/>
    </linearGradient>
    <linearGradient id="evi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.20"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38BDF8" fill-opacity="0.7"/>
    </marker>
  </defs>

  <rect width="1200" height="424" fill="url(#lbg)"/>
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <text x="52" y="52" fill="#64748B" font-size="13" letter-spacing="2.6">CLOSED LOOP</text>
    <text x="52" y="92" fill="#E2E8F0" font-size="28" font-weight="700">四段闭环，每段自带证据</text>
    <text x="52" y="120" fill="#64748B" font-size="14">任何一段的产出都能被第三方按时间顺序回溯</text>

    <!-- 卡片 -->
    <g>
      <rect x="52" y="150" width="208" height="152" rx="14" fill="url(#cardgd)" stroke="#38BDF8" stroke-opacity="0.30"/>
      <text x="74" y="182" fill="#38BDF8" font-size="12" letter-spacing="1.6">01</text>
      <text x="74" y="214" fill="#F1F5F9" font-size="20" font-weight="600">知识准备</text>
      <text x="74" y="244" fill="#94A3B8" font-size="13">课件管理 · 知识点结构化</text>
      <text x="74" y="266" fill="#94A3B8" font-size="13">AI 提取 + 逐条校验</text>
      <text x="74" y="288" fill="#94A3B8" font-size="13">题库两级审核</text>

      <rect x="288" y="150" width="208" height="152" rx="14" fill="url(#cardgd)" stroke="#38BDF8" stroke-opacity="0.30"/>
      <text x="310" y="182" fill="#38BDF8" font-size="12" letter-spacing="1.6">02</text>
      <text x="310" y="214" fill="#F1F5F9" font-size="20" font-weight="600">培训组织</text>
      <text x="310" y="244" fill="#94A3B8" font-size="13">计划 · 场次排课 · 审批门禁</text>
      <text x="310" y="266" fill="#94A3B8" font-size="13">部门数据范围</text>
      <text x="310" y="288" fill="#94A3B8" font-size="13">签到与学时核算</text>

      <rect x="524" y="150" width="208" height="152" rx="14" fill="url(#cardgd)" stroke="#22D3EE" stroke-opacity="0.34"/>
      <text x="546" y="182" fill="#22D3EE" font-size="12" letter-spacing="1.6">03</text>
      <text x="546" y="214" fill="#F1F5F9" font-size="20" font-weight="600">考核实施</text>
      <text x="546" y="244" fill="#94A3B8" font-size="13">组卷 · 计时 · 防切屏</text>
      <text x="546" y="266" fill="#94A3B8" font-size="13">客观题自动判分</text>
      <text x="546" y="288" fill="#94A3B8" font-size="13">主客观分离 · AI 复核</text>

      <rect x="760" y="150" width="208" height="152" rx="14" fill="url(#cardgd)" stroke="#A78BFA" stroke-opacity="0.34"/>
      <text x="782" y="182" fill="#A78BFA" font-size="12" letter-spacing="1.6">04</text>
      <text x="782" y="214" fill="#F1F5F9" font-size="20" font-weight="600">结果发布</text>
      <text x="782" y="244" fill="#94A3B8" font-size="13">成绩公布 · 异议申诉</text>
      <text x="782" y="266" fill="#94A3B8" font-size="13">一题一申 · 一次终审</text>
      <text x="782" y="288" fill="#94A3B8" font-size="13">申诉改分当场留痕</text>

      <rect x="996" y="150" width="152" height="152" rx="14" fill="url(#cardgd)" stroke="#34D399" stroke-opacity="0.34"/>
      <text x="1018" y="182" fill="#34D399" font-size="12" letter-spacing="1.6">05</text>
      <text x="1018" y="214" fill="#F1F5F9" font-size="20" font-weight="600">改进</text>
      <text x="1018" y="244" fill="#94A3B8" font-size="12.5">学习建议</text>
      <text x="1018" y="266" fill="#94A3B8" font-size="12.5">薄弱点看板</text>
      <text x="1018" y="288" fill="#94A3B8" font-size="12.5">报告与委托</text>
    </g>

    <!-- 箭头 -->
    <line x1="262" y1="226" x2="282" y2="226" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.7" marker-end="url(#ar)"/>
    <line x1="498" y1="226" x2="518" y2="226" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.7" marker-end="url(#ar)"/>
    <line x1="734" y1="226" x2="754" y2="226" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.7" marker-end="url(#ar)"/>
    <line x1="970" y1="226" x2="990" y2="226" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.7" marker-end="url(#ar)"/>

    <!-- 证据带 -->
    <rect x="52" y="336" width="1096" height="76" rx="12" fill="url(#evi)" stroke="#38BDF8" stroke-opacity="0.18"/>
    <text x="76" y="366" fill="#7DD3FC" font-size="13" letter-spacing="1.4">EVIDENCE CHAIN</text>
    <text x="76" y="392" fill="#CBD5E1" font-size="14">计划状态机流转 · 审批人 · 签到照片 · 作答快照 · 判分依据 · AI/人工双评分 · 改分前后对照 · 动作码 · 送达与已读 · 建议审计</text>

  </g>
</svg>
