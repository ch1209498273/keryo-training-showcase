<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="门禁死锁与规则纯函数化">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090F1C"/>
      <stop offset="100%" stop-color="#0B1524"/>
    </linearGradient>
    <linearGradient id="redbox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E1620"/>
      <stop offset="100%" stop-color="#221019"/>
    </linearGradient>
    <linearGradient id="grnbox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2A26"/>
      <stop offset="100%" stop-color="#0B1D1C"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#F87171"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#34D399"/>
    </marker>
  </defs>

  <rect width="1200" height="330" fill="url(#dbg)"/>
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">

    <!-- 左：死锁 -->
    <text x="56" y="58" fill="#F87171" font-size="15" letter-spacing="1.2">✗ 门禁放错位置 → 死锁</text>

    <rect x="56" y="86" width="190" height="62" rx="10" fill="url(#redbox)" stroke="#F87171" stroke-opacity="0.45"/>
    <text x="151" y="124" fill="#FCA5A5" font-size="16" text-anchor="middle">计划审批</text>

    <rect x="56" y="200" width="190" height="62" rx="10" fill="url(#redbox)" stroke="#F87171" stroke-opacity="0.45"/>
    <text x="151" y="238" fill="#FCA5A5" font-size="16" text-anchor="middle">场次排课</text>

    <path d="M250 117 C 300 117, 300 231, 254 231" fill="none" stroke="#F87171" stroke-width="2" stroke-opacity="0.9" marker-end="url(#arr)"/>
    <path d="M262 231 C 334 231, 334 117, 266 117" fill="none" stroke="#F87171" stroke-width="1.6" stroke-opacity="0.5" stroke-dasharray="5 5" marker-end="url(#arr)"/>

    <text x="352" y="140" fill="#A86572" font-size="13">审批要求"有场次"</text>
    <text x="352" y="212" fill="#A86572" font-size="13">排课要求"已激活"</text>
    <text x="56" y="300" fill="#F87171" font-size="13" opacity="0.85">两个门禁互为前提，谁也过不去</text>

    <!-- 分隔 -->
    <line x1="560" y1="40" x2="560" y2="290" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 6"/>

    <!-- 右：纯函数 -->
    <text x="620" y="58" fill="#34D399" font-size="15" letter-spacing="1.2">✓ 规则与副作用分离</text>

    <rect x="620" y="102" width="196" height="124" rx="12" fill="url(#grnbox)" stroke="#34D399" stroke-opacity="0.45"/>
    <text x="718" y="142" fill="#6EE7B7" font-size="16" text-anchor="middle">业务规则</text>
    <text x="718" y="170" fill="#7F8FA4" font-size="12.5" text-anchor="middle">抽成无副作用纯函数</text>
    <text x="718" y="194" fill="#7F8FA4" font-size="12.5" text-anchor="middle">输入状态 → 返回是否放行</text>

    <line x1="828" y1="164" x2="858" y2="164" stroke="#34D399" stroke-width="1.8" stroke-opacity="0.8" marker-end="url(#arg)"/>

    <rect x="872" y="102" width="112" height="124" rx="12" fill="url(#grnbox)" stroke="#34D399" stroke-opacity="0.35"/>
    <text x="928" y="152" fill="#6EE7B7" font-size="15" text-anchor="middle">单测</text>
    <text x="928" y="178" fill="#7F8FA4" font-size="12.5" text-anchor="middle">不起系统</text>
    <text x="928" y="200" fill="#7F8FA4" font-size="12.5" text-anchor="middle">就能验证</text>

    <line x1="996" y1="164" x2="1026" y2="164" stroke="#34D399" stroke-width="1.8" stroke-opacity="0.8" marker-end="url(#arg)"/>

    <rect x="1040" y="102" width="120" height="124" rx="12" fill="url(#grnbox)" stroke="#34D399" stroke-opacity="0.35"/>
    <text x="1100" y="152" fill="#6EE7B7" font-size="15" text-anchor="middle">门禁</text>
    <text x="1100" y="178" fill="#7F8FA4" font-size="12.5" text-anchor="middle">只管调用</text>
    <text x="1100" y="200" fill="#7F8FA4" font-size="12.5" text-anchor="middle">不写规则</text>

    <text x="620" y="276" fill="#5B6B80" font-size="13">规则能单独验证，也能单独解释给业务方。</text>
  </g>
</svg>
