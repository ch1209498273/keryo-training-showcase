<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="管理端界面结构示意">
  <defs>
    <linearGradient id="kbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#0C1728"/>
    </linearGradient>
    <linearGradient id="kbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#122740"/>
      <stop offset="100%" stop-color="#101F35"/>
    </linearGradient>
    <linearGradient id="kcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132A45"/>
      <stop offset="100%" stop-color="#0E2136"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="580" fill="url(#kbg)"/>
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <text x="40" y="40" fill="#64748B" font-size="13" letter-spacing="2.6">INTERFACE</text>
    <text x="40" y="76" fill="#E2E8F0" font-size="24" font-weight="700">管理端的每个数字，都必须能下钻到具体的人</text>

    <rect x="40" y="96" width="1120" height="464" rx="12" fill="#0B1727" stroke="#1E3A54"/>

    <!-- 顶栏 -->
    <rect x="40" y="96" width="1120" height="48" rx="12" fill="url(#kbar)"/>
    <rect x="40" y="132" width="1120" height="12" fill="url(#kbar)"/>
    <text x="64" y="126" fill="#E2E8F0" font-size="14" font-weight="600">血透医护培训平台</text>
    <rect x="248" y="108" width="212" height="24" rx="12" fill="#12263C" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="262" y="125" fill="#7DD3FC" font-size="11.5">中心级管理者 · 数据范围限本中心</text>
    <text x="1136" y="125" fill="#64748B" font-size="12" text-anchor="end">待办 3</text>

    <!-- 左导航 -->
    <rect x="56" y="160" width="196" height="384" rx="10" fill="#0D1B2C" stroke="#1B2A40"/>
    <rect x="68" y="174" width="172" height="32" rx="7" fill="#12263C" stroke="#38BDF8" stroke-opacity="0.4"/>
    <text x="82" y="195" fill="#7DD3FC" font-size="12.5">培训计划</text>
    <rect x="68" y="212" width="172" height="32" rx="7" fill="#0F1E30"/>
    <text x="82" y="233" fill="#8A97A8" font-size="12.5">场次与考勤</text>
    <rect x="68" y="250" width="172" height="32" rx="7" fill="#0F1E30"/>
    <text x="82" y="271" fill="#8A97A8" font-size="12.5">成绩与复核</text>
    <rect x="68" y="288" width="172" height="32" rx="7" fill="#0F1E30"/>
    <text x="82" y="309" fill="#8A97A8" font-size="12.5">数据看板</text>
    <rect x="68" y="326" width="172" height="32" rx="7" fill="#0F1E30"/>
    <text x="82" y="347" fill="#8A97A8" font-size="12.5">学员反馈</text>

    <line x1="68" y1="374" x2="240" y2="374" stroke="#1B2A40"/>
    <text x="68" y="398" fill="#5B6B80" font-size="11">本中心待办</text>
    <text x="240" y="398" fill="#FBBF24" font-size="11" text-anchor="end">3</text>
    <text x="68" y="422" fill="#7A8A9C" font-size="11.5">成绩待发布</text>
    <text x="240" y="422" fill="#5B6B80" font-size="11.5" text-anchor="end">1</text>
    <text x="68" y="444" fill="#7A8A9C" font-size="11.5">申诉待终审</text>
    <text x="240" y="444" fill="#5B6B80" font-size="11.5" text-anchor="end">2</text>
    <text x="68" y="466" fill="#7A8A9C" font-size="11.5">忘记密码申请</text>
    <text x="240" y="466" fill="#5B6B80" font-size="11.5" text-anchor="end">0</text>

    <rect x="68" y="490" width="172" height="42" rx="8" fill="#101F33" stroke="#1E3A54"/>
    <text x="80" y="508" fill="#5B6B80" font-size="10.5">数据范围</text>
    <text x="80" y="524" fill="#8A97A8" font-size="11">本中心 + 2 个科室</text>

    <!-- 主区 -->
    <rect x="268" y="160" width="596" height="384" rx="10" fill="#0D1B2C" stroke="#1B2A40"/>
    <text x="288" y="184" fill="#5B6B80" font-size="11">培训计划 / 详情</text>
    <text x="288" y="208" fill="#E2E8F0" font-size="15" font-weight="600">第四季度 · 血液透析院感防控专项培训</text>

    <!-- 状态机 -->
    <g font-size="11.5">
      <circle cx="298" cy="238" r="4.5" fill="none" stroke="#34D399" stroke-width="1.4" stroke-opacity="0.6"/>
      <text x="308" y="242" fill="#5E9E86">待审批</text>
      <line x1="354" y1="238" x2="392" y2="238" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.55"/>
      <circle cx="401" cy="238" r="5" fill="#34D399"/>
      <text x="411" y="242" fill="#6EE7B7">已激活</text>
      <line x1="457" y1="238" x2="495" y2="238" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.55"/>
      <circle cx="504" cy="238" r="5" fill="#34D399"/>
      <circle cx="504" cy="238" r="9" fill="none" stroke="#34D399" stroke-opacity="0.35"/>
      <text x="514" y="242" fill="#6EE7B7">进行中</text>
      <line x1="560" y1="238" x2="598" y2="238" stroke="#3A4A5E" stroke-width="1.5"/>
      <circle cx="607" cy="238" r="4.5" fill="none" stroke="#3A4A5E" stroke-width="1.6"/>
      <text x="617" y="242" fill="#5B6B80">已结束</text>
      <line x1="663" y1="238" x2="701" y2="238" stroke="#3A4A5E" stroke-width="1.5"/>
      <circle cx="710" cy="238" r="4.5" fill="none" stroke="#3A4A5E" stroke-width="1.6"/>
      <text x="720" y="242" fill="#5B6B80">已归档</text>
    </g>

    <!-- 指标卡 -->
    <rect x="288" y="262" width="176" height="66" rx="9" fill="url(#kcard)" stroke="#38BDF8" stroke-opacity="0.28"/>
    <text x="302" y="284" fill="#5B6B80" font-size="11">应参训</text>
    <text x="302" y="312" fill="#7DD3FC" font-size="22" font-weight="700">42</text>
    <text x="448" y="312" fill="#5B6B80" font-size="10.5" text-anchor="end">人</text>

    <rect x="478" y="262" width="176" height="66" rx="9" fill="url(#kcard)" stroke="#38BDF8" stroke-opacity="0.28"/>
    <text x="492" y="284" fill="#5B6B80" font-size="11">已完成学习</text>
    <text x="492" y="312" fill="#E2E8F0" font-size="22" font-weight="700">31</text>
    <text x="638" y="312" fill="#5B6B80" font-size="10.5" text-anchor="end">人</text>

    <rect x="668" y="262" width="176" height="66" rx="9" fill="url(#kcard)" stroke="#34D399" stroke-opacity="0.28"/>
    <text x="682" y="284" fill="#5B6B80" font-size="11">考核通过率</text>
    <text x="682" y="312" fill="#6EE7B7" font-size="22" font-weight="700">88.1%</text>

    <!-- 场次表 -->
    <text x="288" y="356" fill="#5B6B80" font-size="11">场次与签到</text>
    <line x1="288" y1="366" x2="844" y2="366" stroke="#1B2A40"/>
    <text x="288" y="386" fill="#4E5F72" font-size="10.5">日期</text>
    <text x="400" y="386" fill="#4E5F72" font-size="10.5">场次</text>
    <text x="560" y="386" fill="#4E5F72" font-size="10.5">签到</text>
    <text x="700" y="386" fill="#4E5F72" font-size="10.5">状态</text>

    <text x="288" y="412" fill="#C8D3E0" font-size="11.5">10-12 上午</text>
    <text x="400" y="412" fill="#C8D3E0" font-size="11.5">第一场 · 理论</text>
    <text x="560" y="412" fill="#C8D3E0" font-size="11.5">38 / 42</text>
    <text x="700" y="412" fill="#6EE7B7" font-size="11.5">已完成</text>

    <text x="288" y="438" fill="#C8D3E0" font-size="11.5">10-19 下午</text>
    <text x="400" y="438" fill="#C8D3E0" font-size="11.5">第二场 · 实操</text>
    <text x="560" y="438" fill="#C8D3E0" font-size="11.5">12 / 42</text>
    <text x="700" y="438" fill="#FBBF24" font-size="11.5">进行中</text>

    <line x1="288" y1="454" x2="844" y2="454" stroke="#1B2A40"/>
    <!-- 证据提示 -->
    <rect x="288" y="470" width="556" height="56" rx="9" fill="#0F2419" stroke="#34D399" stroke-opacity="0.28"/>
    <text x="304" y="492" fill="#6EE7B7" font-size="11.5">证据链已记录</text>
    <text x="304" y="512" fill="#7A8A9C" font-size="10.5">审批人 · 签到照片 · 判分依据 · 改分前后对照，均可按时间顺序回溯</text>

    <!-- 右栏 -->
    <rect x="880" y="160" width="264" height="384" rx="10" fill="#0D1B2C" stroke="#1B2A40"/>
    <text x="896" y="184" fill="#7DD3FC" font-size="12">成绩发布</text>

    <rect x="896" y="196" width="232" height="96" rx="8" fill="#101F33" stroke="#1E3A54"/>
    <text x="908" y="216" fill="#C8D3E0" font-size="11.5">第一场 · 待发布</text>
    <text x="908" y="234" fill="#5B6B80" font-size="10.5">客观题已判 · 主观题待复核</text>
    <line x1="908" y1="244" x2="1116" y2="244" stroke="#1B2A40"/>
    <text x="908" y="262" fill="#8A97A8" font-size="10.5">AI 建议分：38 份</text>
    <text x="908" y="280" fill="#8A97A8" font-size="10.5">人工已复核：26 份</text>

    <rect x="896" y="304" width="232" height="80" rx="8" fill="#25131C" stroke="#F87171" stroke-opacity="0.4"/>
    <text x="908" y="324" fill="#FCA5A5" font-size="11.5">申诉待终审 2 条</text>
    <text x="908" y="342" fill="#8A6672" font-size="10.5">一题一申 · 一次终审</text>
    <text x="908" y="362" fill="#8A6672" font-size="10.5">改分需留痕并记录动作码</text>

    <rect x="896" y="396" width="232" height="72" rx="8" fill="#101F33" stroke="#1E3A54"/>
    <text x="908" y="416" fill="#C8D3E0" font-size="11.5">发布前检查</text>
    <text x="908" y="434" fill="#6EE7B7" font-size="10.5">✓ 全部作答已交卷</text>
    <text x="908" y="452" fill="#6EE7B7" font-size="10.5">✓ 主观题复核率 100%</text>

    <rect x="896" y="480" width="232" height="46" rx="8" fill="#12263C" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="1012" y="508" fill="#7DD3FC" font-size="12.5" text-anchor="middle">确认发布成绩</text>
  </g>
</svg>
